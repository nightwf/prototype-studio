name: Deploy Prototype Studio Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    if: ${{ vars.ENABLE_TENCENT_DEPLOY == 'true' }}
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd /srv/prototype-studio-web || exit 1
            test -f .env.production
            git fetch origin main
            git merge --ff-only origin/main
            docker compose --env-file .env.production up -d --build
            for attempt in $(seq 1 30); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/me || true)
              if [ "$code" = "200" ]; then
                echo "health:200"
                exit 0
              fi
              sleep 2
            done
            docker compose --env-file .env.production logs --tail=100 app
            exit 1
