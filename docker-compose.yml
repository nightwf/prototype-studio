name: prototype-studio

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      SPACES_DIR: /data/spaces
      BASE_URL: ${BASE_URL:?set BASE_URL in .env.production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      INVITE_CODES: ${INVITE_CODES:?set INVITE_CODES in .env.production}
    volumes:
      - spaces:/data/spaces
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: ${PGDATA_VOLUME:-prototype-studio_pgdata}
  spaces:
    name: ${SPACES_VOLUME:-prototype-studio_spaces}
