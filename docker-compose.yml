services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: prototype
      POSTGRES_DB: prototype_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d prototype_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      SPACES_DIR: /data/spaces
      BASE_URL: ${BASE_URL:-http://localhost:8787}
      DATABASE_URL: postgres://prototype:prototype@db:5432/prototype_studio
      INVITE_CODES: ${INVITE_CODES:-PROTOTYPE-DEV}
    volumes:
      - spaces:/data/spaces
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  spaces:
